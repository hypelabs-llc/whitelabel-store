allowBuilds:
  '@parcel/watcher': false
  sharp: false
  unrs-resolver: false
# @hypelabs-llc/ts-sdk 0.2.3 was published recently; exclude it from the minimumReleaseAge check so CI
# installs don't fail. Remove this line once the version is older than the cutoff.
minimumReleaseAgeExclude:
  - '@hypelabs-llc/ts-sdk@0.3.1'
  - '@next/env@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - next@16.4.5
  - '@next/eslint-plugin-next@16.4.5'
  - eslint-config-next@16.4.5
